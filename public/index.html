<!DOCTYPE html>
<html>
<head>
  <title>Task Manager</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; }
    .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; }
    h1 { margin-bottom: 20px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; }
    input, textarea { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
    textarea { resize: vertical; min-height: 80px; }
    button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background: #0056b3; }
    .task { border: 1px solid #ddd; padding: 15px; margin: 10px 0; border-radius: 4px; }
    .task h3 { margin-bottom: 8px; }
    .task p { margin-bottom: 10px; color: #666; }
    .task-actions { display: flex; gap: 10px; }
    .task-actions button { padding: 5px 10px; font-size: 14px; }
    .btn-delete { background: #dc3545; }
    .btn-delete:hover { background: #c82333; }
    .btn-edit { background: #28a745; }
    .btn-edit:hover { background: #218838; }
    .hidden { display: none; }
    .error { color: red; margin: 10px 0; }
    .success { color: green; margin: 10px 0; }
  </style>
</head>
<body>
  <div class="container">
    <div id="auth-section">
      <h1>Task Manager</h1>
      <div id="login-form">
        <h2>Login</h2>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="login-email">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="login-password">
        </div>
        <button onclick="login()">Login</button>
        <button onclick="showRegister()">Register</button>
        <div id="login-error" class="error"></div>
      </div>
      
      <div id="register-form" class="hidden">
        <h2>Register</h2>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="register-email">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="register-password">
        </div>
        <button onclick="register()">Register</button>
        <button onclick="showLogin()">Back to Login</button>
        <div id="register-error" class="error"></div>
        <div id="register-success" class="success"></div>
      </div>
    </div>

    <div id="tasks-section" class="hidden">
      <h1>My Tasks</h1>
      <button onclick="logout()">Logout</button>
      
      <div style="margin: 20px 0;">
        <h2>Create Task</h2>
        <div class="form-group">
          <label>Title</label>
          <input type="text" id="task-title">
        </div>
        <div class="form-group">
          <label>Description</label>
          <textarea id="task-description"></textarea>
        </div>
        <button onclick="createTask()">Add Task</button>
        <div id="task-error" class="error"></div>
      </div>

      <div id="tasks-list"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
